<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="caja">
        <h1>🔍 Analizando...</h1>

        <p id="texto">Analizando a tu hermana...</p>

        <div class="barra">
            <div class="progreso" id="progreso"></div>
        </div>

        <div id="resultado">

            <p>Nivel de henanismo: <b>99%</b></p>

            <p>Nivel de desempleo: <b>100%</b></p>

            <h2>Diagnóstico final:</h2>

            <div class="final">
                Desempleada y enana 💀
            </div>

            <button onclick="remate()">
                Aceptar mi destino
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
